services:
  - type: web
    name: cielotuc-backend
    runtime: python
    pythonVersion: "3.11"
    plan: free
    rootDir: cielotuc-backend/cielotuc
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health
