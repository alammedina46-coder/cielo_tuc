services:
  - type: web
    name: cielotuc-backend
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health
