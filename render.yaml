services:
  - type: web
    name: cielotuc-backend
    runtime: python
    plan: free
    buildCommand: cd cielotuc-backend/cielotuc && pip install -r requirements.txt
    startCommand: cd cielotuc-backend/cielotuc && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: "https://cielo-tuc.vercel.app"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_PHONE
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_ALERT_RECIPIENTS
        sync: false
    healthCheckPath: /health
