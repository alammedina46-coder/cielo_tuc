services:
  - type: web
    name: cielotuc-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health
